<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> حرفه‌ای</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fabric.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
    <!-- Vue.js 3 -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts / Vazirmatn -->
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .canvas-container {
            margin: 0 auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }
    </style>
</head>
<body class="h-screen flex flex-col justify-between overflow-hidden">

    <div id="app" class="flex flex-col h-full">
        <!-- Header -->
        <header class="glass px-6 py-4 flex justify-between items-center z-10">
            <h1 class="text-xl font-bold bg-gradient-to-r from-pink-500 to-violet-500 bg-clip-text text-transparent">
                <i class="fa-solid fa-wand-magic-sparkles ml-2"></i>استوری‌ساز فارسی
            </h1>
            <div class="flex gap-3">
                <button @click="downloadStory" class="bg-gradient-to-r from-pink-500 to-purple-600 hover:from-pink-600 hover:to-purple-700 text-white px-5 py-2 rounded-xl text-sm font-semibold transition flex items-center gap-2">
                    <i class="fa-solid fa-download"></i> دانلود خروجی
                </button>
            </div>
        </header>

        <!-- Main Content -->
        <div class="flex-1 flex overflow-hidden">
            <!-- Sidebar: Tools & Templates -->
            <aside class="w-80 glass p-4 flex flex-col gap-6 overflow-y-auto">
                <!-- Add Elements -->
                <div>
                    <h2 class="text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider">افزودن عناصر</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <button @click="addText" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg flex flex-col items-center justify-center gap-2 border border-slate-700 transition">
                            <i class="fa-solid fa-font text-lg text-pink-400"></i>
                            <span class="text-xs">متن جدید</span>
                        </button>
                        <label class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg flex flex-col items-center justify-center gap-2 border border-slate-700 transition cursor-pointer">
                            <i class="fa-solid fa-image text-lg text-purple-400"></i>
                            <span class="text-xs">آپلود تصویر</span>
                            <input type="file" @change="uploadImage" accept="image/*" class="hidden">
                        </label>
                    </div>
                </div>

                <!-- Canvas Background Color -->
                <div>
                    <h2 class="text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider">رنگ پس‌زمینه</h2>
                    <div class="flex gap-2">
                        <input type="color" v-model="bgColor" @change="changeBgColor" class="w-10 h-10 rounded cursor-pointer bg-transparent border-0">
                        <div class="flex gap-1 flex-1">
                            <button v-for="color in presetColors" :key="color" @click="setBgColor(color)" class="w-8 h-8 rounded-full border border-slate-600" :style="{ backgroundColor: color }"></button>
                        </div>
                    </div>
                </div>

                <!-- Templates -->
                <div>
                    <h2 class="text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider">قالب‌های آماده</h2>
                    <div class="grid grid-cols-2 gap-2">
                        <button v-for="(tpl, index) in templates" :key="index" @click="applyTemplate(tpl)" class="p-3 bg-slate-800 hover:bg-slate-700 rounded-lg text-right border border-slate-700 transition">
                            <div class="text-xs font-medium text-slate-200">{{ tpl.name }}</div>
                        </button>
                    </div>
                </div>

                <!-- Selected Object Controls -->
                <div v-if="selectedObject" class="border-t border-slate-700 pt-4">
                    <h2 class="text-xs font-semibold text-slate-400 mb-3 uppercase tracking-wider">تنظیمات عنصر انتخابی</h2>
                    <div v-if="selectedObject.type === 'i-text'" class="space-y-3">
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">رنگ متن</label>
                            <input type="color" v-model="textColor" @change="changeTextColor" class="w-full h-8 rounded bg-transparent cursor-pointer">
                        </div>
                        <div>
                            <label class="text-xs text-slate-400 block mb-1">اندازه فونت</label>
                            <input type="range" min="12" max="120" v-model="fontSize" @input="changeFontSize" class="w-full">
                        </div>
                    </div>
                    <button @click="deleteSelected" class="w-full mt-4 p-2 bg-red-500/20 text-red-400 hover:bg-red-500/30 rounded-lg text-xs font-semibold transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-trash"></i> حذف عنصر
                    </button>
                </div>
            </aside>

            <!-- Workspace / Canvas Area -->
            <main class="flex-1 flex items-center justify-center p-6 bg-slate-950 overflow-auto">
                <div class="relative">
                    <canvas id="storyCanvas"></canvas>
                </div>
            </main>
        </div>
    </div>

    <script>
        const { createApp, ref, onMounted } = Vue;

        createApp({
            setup() {
                const canvas = ref(null);
                const selectedObject = ref(null);
                const bgColor = ref('#ffffff');
                const textColor = ref('#000000');
                const fontSize = ref(40);

                const presetColors = ['#ffffff', '#000000', '#f43f5e', '#8b5cf6', '#06b6d4', '#10b981'];

                const templates = [
                    { name: 'مینیمال روشن', bg: '#f8fafc', text: 'عنوان استوری شما', textColor: '#0f172a' },
                    { name: 'مدرن تاریک', bg: '#0f172a', text: 'پیشنهاد ویژه امروز', textColor: '#f8fafc' },
                    { name: 'جذاب ارغوانی', bg: '#581c87', text: 'تخفیف شگفت‌انگیز', textColor: '#fef08a' },
                    { name: 'تکست جادویی', bg: '#831843', text: 'داستان جدید...', textColor: '#fbcfe8' }
                ];

                onMounted(() => {
                    // Initialize Fabric Canvas (Instagram Story Aspect Ratio: 9:16)
                    canvas.value = new fabric.Canvas('storyCanvas', {
                        width: 360,
                        height: 640,
                        backgroundColor: '#ffffff'
                    });

                    canvas.value.on('selection:created', updateSelection);
                    canvas.value.on('selection:updated', updateSelection);
                    canvas.value.on('selection:cleared', () => { selectedObject.value = null; });
                });

                const updateSelection = (e) => {
                    selectedObject.value = e.selected[0];
                    if (selectedObject.value && selectedObject.value.type === 'i-text') {
                        textColor.value = selectedObject.value.fill;
                        fontSize.value = selectedObject.value.fontSize;
                    }
                };

                const addText = () => {
                    const text = new fabric.IText('متن خود را وارد کنید', {
                        left: 50,
                        top: 250,
                        fontFamily: 'Vazirmatn',
                        fill: '#000000',
                        fontSize: 32,
                        direction: 'rtl'
                    });
                    canvas.value.add(text);
                    canvas.value.setActiveObject(text);
                };

                const uploadImage = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;

                    const reader = new FileReader();
                    reader.onload = (f) => {
                        fabric.Image.fromURL(f.target.result, (img) => {
                            img.scaleToWidth(250);
                            canvas.value.add(img);
                            canvas.value.centerObject(img);
                            canvas.value.setActiveObject(img);
                        });
                    };
                    reader.readAsDataURL(file);
                };

                const changeBgColor = () => {
                    canvas.value.setBackgroundColor(bgColor.value, canvas.value.renderAll.bind(canvas.value));
                };

                const setBgColor = (color) => {
                    bgColor.value = color;
                    changeBgColor();
                };

                const changeTextColor = () => {
                    if (selectedObject.value && selectedObject.value.type === 'i-text') {
                        selectedObject.value.set('fill', textColor.value);
                        canvas.value.renderAll();
                    }
                };

                const changeFontSize = () => {
                    if (selectedObject.value && selectedObject.value.type === 'i-text') {
                        selectedObject.value.set('fontSize', parseInt(fontSize.value));
                        canvas.value.renderAll();
                    }
                };

                const deleteSelected = () => {
                    const activeObjects = canvas.value.getActiveObjects();
                    canvas.value.discardActiveObject();
                    activeObjects.forEach((obj) => {
                        canvas.value.remove(obj);
                    });
                };

                const applyTemplate = (tpl) => {
                    canvas.value.clear();
                    setBgColor(tpl.bg);
                    const text = new fabric.IText(tpl.text, {
                        left: 40,
                        top: 280,
                        fontFamily: 'Vazirmatn',
                        fill: tpl.textColor,
                        fontSize: 36,
                        direction: 'rtl'
                    });
                    canvas.value.add(text);
                };

                const downloadStory = () => {
                    const dataURL = canvas.value.toDataURL({
                        format: 'png',
                        quality: 1,
                        multiplier: 3 // Higher resolution export
                    });
                    const link = document.createElement('a');
                    link.download = 'story.png';
                    link.href = dataURL;
                    link.click();
                };

                return {
                    addText,
                    uploadImage,
                    bgColor,
                    changeBgColor,
                    presetColors,
                    setBgColor,
                    templates,
                    applyTemplate,
                    selectedObject,
                    textColor,
                    changeTextColor,
                    fontSize,
                    changeFontSize,
                    deleteSelected,
                    downloadStory
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
