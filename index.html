<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>استوری فونت - Story Font Studio</title>
    
    <!-- فونت‌های گوگل و cdnjs -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Aref+Ruqaa:wght@700&family=Lalezar&family=Montserrat:wght@700;900&family=Pacifico&family=Poppins:wght@700;900&family=Rubik:wght@700;900&family=Vazirmatn:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        /* فونت‌های سفارشی */
        @font-face {
            font-family: 'Samim';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/samim-font@v4.0.5/dist/Samim.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Shabnam';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/shabnam-font@v5.0.0/dist/Shabnam.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Sahel';
            src: url('https://cdn.jsdelivr.net/gh/rastikerdar/sahel-font@v3.4.0/dist/Sahel.woff2') format('woff2');
        }

        :root {
            --primary-pink: #e91e63;
            --bg-canvas: #e91e63;
            --card-bg: rgba(255, 255, 255, 0.22);
            --card-border: rgba(255, 255, 255, 0.25);
            --text-color: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: #0f0f12;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            direction: rtl;
        }

        /* قاب اصلی برنامه */
        .phone-container {
            width: 100%;
            max-width: 412px;
            height: 100vh;
            max-height: 870px;
            background: var(--bg-canvas);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7);
        }

        @media (min-width: 500px) {
            .phone-container {
                border-radius: 36px;
                height: 92vh;
                border: 6px solid #222;
            }
        }

        /* نوار بالایی */
        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            z-index: 10;
        }

        .top-icons-right {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }

        .icon-btn:active {
            background: rgba(255, 255, 255, 0.35);
        }

        .btn-copy-main {
            background: #ffffff;
            color: #000000;
            font-weight: 800;
            font-size: 0.88rem;
            padding: 8px 18px;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        /* بنر هشدار بالا */
        .alert-banner {
            margin: 0 16px;
            background: rgba(0, 0, 0, 0.22);
            padding: 8px 14px;
            border-radius: 10px;
            font-size: 0.72rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(4px);
        }

        /* بوم اصلی نمایش */
        .workspace {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* دکمه‌های شناور سمت چپ بوم */
        .floating-controls-left {
            position: absolute;
            left: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 5;
        }

        .action-circle-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.22);
            border: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(6px);
            font-size: 0.85rem;
        }

        /* اسلایدر عمودی اندازه سمت راست */
        .vertical-slider-wrap {
            position: absolute;
            right: 12px;
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .vertical-slider {
            -webkit-appearance: none;
            width: 140px;
            height: 4px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.35);
            outline: none;
            transform: rotate(-90deg);
        }

        .vertical-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        /* پنل پایین */
        .bottom-panel {
            background: transparent;
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-bottom: 10px;
            z-index: 10;
        }

        /* فیلترها */
        .filter-tags {
            display: flex;
            gap: 8px;
            padding: 0 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .filter-tags::-webkit-scrollbar { display: none; }

        .tag-btn {
            background: rgba(255, 255, 255, 0.18);
            border: none;
            color: rgba(255, 255, 255, 0.9);
            padding: 5px 14px;
            border-radius: 10px;
            font-size: 0.75rem;
            font-weight: bold;
            white-space: nowrap;
            cursor: pointer;
        }

        .tag-btn.active {
            background: rgba(255, 255, 255, 0.38);
            color: #fff;
        }

        /* کارت‌های افقی فونت */
        .font-cards-scroll {
            display: flex;
            gap: 10px;
            padding: 4px 16px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .font-cards-scroll::-webkit-scrollbar { display: none; }

        .card-import {
            min-width: 80px;
            height: 80px;
            background: rgba(255, 255, 255, 0.15);
            border: 2px dashed rgba(255, 255, 255, 0.4);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            color: white;
            font-size: 0.7rem;
            gap: 4px;
            text-align: center;
        }

        .font-card {
            min-width: 85px;
            height: 80px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            flex-shrink: 0;
            backdrop-filter: blur(8px);
            transition: all 0.2s ease;
        }

        .font-card.active {
            background: transparent;
            border: 2px solid #ffffff;
        }

        .font-card-title {
            color: #ffffff;
            font-size: 1.15rem;
            text-align: center;
        }

        .font-card-heart {
            position: absolute;
            bottom: 6px;
            font-size: 0.65rem;
            color: rgba(255, 255, 255, 0.7);
        }

        /* تب‌های اصلی سفلی */
        .main-tabs {
            display: flex;
            justify-content: space-around;
            padding: 8px 10px 0 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .main-tab-item {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.65);
            font-size: 0.85rem;
            font-weight: bold;
            padding: 4px 12px;
            cursor: pointer;
            position: relative;
        }

        .main-tab-item.active {
            color: #ffffff;
        }

        .main-tab-item.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 20%;
            width: 60%;
            height: 2px;
            background: #ffffff;
            border-radius: 2px;
        }

        /* پنل‌های تنظیمات پیشرفته زیرین */
        .sub-panel {
            display: none;
            padding: 8px 16px;
            gap: 10px;
            flex-direction: column;
            max-height: 130px;
            overflow-y: auto;
        }
        .sub-panel.active { display: flex; }

        .control-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            font-size: 0.75rem;
        }

        .control-row select, .control-row input[type="range"] {
            background: rgba(255,255,255,0.2);
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 8px;
            outline: none;
        }

        .color-picker-circle {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid white;
            cursor: pointer;
            background: transparent;
        }

        /* ایموجی استیکرها */
        .emoji-grid {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 4px 0;
        }

        .emoji-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            font-size: 1.1rem;
            padding: 6px 10px;
            border-radius: 10px;
            cursor: pointer;
        }

        /* مدال ویرایش متن */
        .text-modal {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.88);
            z-index: 100;
            display: none;
            flex-direction: column;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .text-modal.active { display: flex; }

        .text-modal textarea {
            width: 100%;
            height: 180px;
            background: transparent;
            border: none;
            color: white;
            font-size: 1.4rem;
            outline: none;
            text-align: center;
            margin-top: 40px;
        }

        .text-modal-close {
            align-self: flex-end;
            background: white;
            color: black;
            border: none;
            padding: 6px 18px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
        }

        /* توست پیام */
        .toast {
            position: absolute;
            top: 60px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            background: rgba(0, 0, 0, 0.8);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.8rem;
            transition: all 0.3s ease;
            z-index: 200;
            pointer-events: none;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="phone-container">
        <!-- پیام توست -->
        <div class="toast" id="toast">متن در کلیپ بورد کپی شد</div>

        <!-- نوار بالایی -->
        <div class="top-bar">
            <div class="top-icons-right">
                <button class="icon-btn" onclick="showToast('راهنما')"><i class="fa-solid fa-circle-question"></i></button>
            </div>
            <div style="display: flex; gap: 8px; align-items: center;">
                <button class="icon-btn" onclick="showToast('تاریخچه')"><i class="fa-solid fa-clock-rotate-left"></i></button>
                <button class="icon-btn" onclick="changeBgColor()"><i class="fa-solid fa-circle-half-stroke"></i></button>
                <button class="btn-copy-main" onclick="copyCanvasImage()">کپی فونت</button>
            </div>
        </div>

        <!-- بنر هشدار -->
        <div class="alert-banner">
            شما از یک پس زمینه قفل استفاده کرده اید، برای کپی ارتقاء دهید
        </div>

        <!-- بوم اصلی Workspace -->
        <div class="workspace">
            <canvas id="canvas"></canvas>

            <!-- کنترل‌های سمت چپ بوم -->
            <div class="floating-controls-left">
                <button class="action-circle-btn" onclick="toggleAlign()"><i class="fa-solid fa-align-center" id="alignIcon"></i></button>
                <button class="action-circle-btn" onclick="clearText()"><i class="fa-solid fa-trash-can"></i></button>
                <button class="action-circle-btn" onclick="openTextModal()"><i class="fa-solid fa-pen"></i></button>
            </div>

            <!-- اسلایدر اندازه سمت راست -->
            <div class="vertical-slider-wrap">
                <input type="range" class="vertical-slider" id="sliderSize" min="25" max="110" value="55">
            </div>
        </div>

        <!-- پنل تنظیمات زیرین -->
        <div class="bottom-panel">
            
            <!-- تب ۱: فونت‌ها -->
            <div id="tabContentFonts">
                <div class="filter-tags">
                    <button class="tag-btn active">All <i class="fa-solid fa-angle-down" style="font-size: 0.6rem;"></i></button>
                    <button class="tag-btn">New</button>
                    <button class="tag-btn">Favorite</button>
                    <button class="tag-btn">Free</button>
                    <button class="tag-btn">Imported</button>
                </div>

                <div class="font-cards-scroll" style="margin-top: 8px;">
                    <!-- کارت ایمپورت -->
                    <div class="card-import" onclick="document.getElementById('fontFileInput').click()">
                        <i class="fa-solid fa-plus"></i>
                        <span>دانلود<br>ایمپورت</span>
                        <input type="file" id="fontFileInput" accept=".ttf,.otf,.woff,.woff2" style="display: none;">
                    </div>

                    <!-- کارت‌های فونت -->
                    <div class="font-card active" onclick="selectFont('Vazirmatn', this)">
                        <span class="font-card-title" style="font-family: 'Vazirmatn';">سینما</span>
                        <i class="fa-regular fa-heart font-card-heart"></i>
                    </div>

                    <div class="font-card" onclick="selectFont('Lalezar', this)">
                        <span class="font-card-title" style="font-family: 'Lalezar';">بنیاد</span>
                        <i class="fa-regular fa-heart font-card-heart"></i>
                    </div>

                    <div class="font-card" onclick="selectFont('Samim', this)">
                        <span class="font-card-title" style="font-family: 'Samim';">برق</span>
                        <i class="fa-regular fa-heart font-card-heart"></i>
                    </div>

                    <div class="font-card" onclick="selectFont('Shabnam', this)">
                        <span class="font-card-title" style="font-family: 'Shabnam';">کپسول</span>
                        <i class="fa-regular fa-heart font-card-heart"></i>
                    </div>

                    <div class="font-card" onclick="selectFont('Sahel', this)">
                        <span class="font-card-title" style="font-family: 'Sahel';">ساحل</span>
                        <i class="fa-regular fa-heart font-card-heart"></i>
                    </div>

                    <div class="font-card" onclick="selectFont('Amiri', this)">
                        <span class="font-card-title" style="font-family: 'Amiri';">امیری</span>
                        <i class="fa-regular fa-heart font-card-heart"></i>
                    </div>

                    <div class="font-card" onclick="selectFont('Aref Ruqaa', this)">
                        <span class="font-card-title" style="font-family: 'Aref Ruqaa';">رقعة</span>
                        <i class="fa-regular fa-heart font-card-heart"></i>
                    </div>

                    <div class="font-card" onclick="selectFont('Montserrat', this)">
                        <span class="font-card-title" style="font-family: 'Montserrat';">Modern</span>
                        <i class="fa-regular fa-heart font-card-heart"></i>
                    </div>

                    <div class="font-card" onclick="selectFont('Pacifico', this)">
                        <span class="font-card-title" style="font-family: 'Pacifico';">Fancy</span>
                        <i class="fa-regular fa-heart font-card-heart"></i>
                    </div>
                </div>
            </div>

            <!-- تب ۲: استایل و برچسب -->
            <div class="sub-panel" id="tabContentStyle">
                <div class="control-row">
                    <label>طرح برچسب:</label>
                    <select id="badgeStyleSelect" onchange="render()">
                        <option value="pill" style="color:black">کپسولی گرد</option>
                        <option value="rounded" style="color:black">گوشه گرد</option>
                        <option value="rect" style="color:black">مستطیل</option>
                        <option value="none" style="color:black">بدون برچسب</option>
                    </select>

                    <label>پترن برچسب:</label>
                    <select id="badgePatternSelect" onchange="render()">
                        <option value="none" style="color:black">ساده</option>
                        <option value="stripes" style="color:black">خطوط مورب</option>
                        <option value="dots" style="color:black">نقطه‌ای</option>
                    </select>
                </div>

                <div class="control-row">
                    <label>شفافیت برچسب:</label>
                    <input type="range" id="badgeOpacity" min="0.1" max="1" step="0.1" value="0.9" oninput="render()">
                    
                    <label>فاصله داخلی:</label>
                    <input type="range" id="badgePadding" min="0.2" max="0.8" step="0.1" value="0.4" oninput="render()">
                </div>
            </div>

            <!-- تب ۳: رنگ و سایه -->
            <div class="sub-panel" id="tabContentColor">
                <div class="control-row">
                    <span>رنگ متن:</span>
                    <input type="color" id="textColorPicker" value="#222222" onchange="render()" class="color-picker-circle">
                    <span
